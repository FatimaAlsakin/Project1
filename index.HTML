<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
    <script src=""></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
    
<body>
       
    <nav> 
        <p id="how-to-play"><span class="material-symbols-outlined">help</span></p>
        <h1>Wordle</h1>   
        <p id="hint"><span class="material-symbols-outlined">lightbulb_2</span></p>
        
    </nav>

    <hr>

    <section class="rows">
        <div id="row1">
            <div class="sqr" id="10"></div>
            <div class="sqr" id="11"></div>
            <div class="sqr" id="12"></div>
            <div class="sqr" id="13"></div>
            <div class="sqr" id="14"></div>
        </div>
        
        <div id="row2">
            <div class="sqr" id="20"></div>
            <div class="sqr" id="21"></div>
            <div class="sqr" id="22"></div>
            <div class="sqr" id="23"></div>
            <div class="sqr" id="24"></div>
        </div>

        <div id="row3">
            <div class="sqr" id="30"></div>
            <div class="sqr" id="31"></div>
            <div class="sqr" id="32"></div>
            <div class="sqr" id="33"></div>
            <div class="sqr" id="34"></div>
        </div>

        <div id="row4">
            <div class="sqr" id="40"></div>
            <div class="sqr" id="41"></div>
            <div class="sqr" id="42"></div>
            <div class="sqr" id="43"></div>
            <div class="sqr" id="44"></div>
        </div>

        <siv id="row5">
            <div class="sqr" id="50"></div>
            <div class="sqr" id="51"></div>
            <div class="sqr" id="52"></div>
            <div class="sqr" id="53"></div>
            <div class="sqr" id="54"></div>
        </siv>

        <div class="row6">
            <div class="sqr" id="60"></div>
            <div class="sqr" id="61"></div>
            <div class="sqr" id="62"></div>
            <div class="sqr" id="63"></div>
            <div class="sqr" id="64"></div>
        </div>
    </section>

    <br>

    <section id="keyboard">
        <div class="keyboard">
            <button class="key" id="q">Q</button>
            <button class="key" id="w">W</button>
            <button class="key" id="e">E</button>
            <button class="key" id="r">R</button>
            <button class="key" id="t">T</button>
            <button class="key" id="y">Y</button>
            <button class="key" id="u">U</button>
            <button class="key" id="i">I</button>
            <button class="key" id="o">O</button>
            <button class="key" id="p">P</button>
        </div>

         <div class="keyboard">
            <button class="key" id="a">A</button>
            <button class="key" id="s">S</button>
            <button class="key" id="d">D</button>
            <button class="key" id="f">F</button>
            <button class="key" id="g">G</button>
            <button class="key" id="h">H</button>
            <button class="key" id="j">J</button>
            <button class="key" id="k">K</button>
            <button class="key" id="l">L</button>
        </div>

         <div class="keyboard">
            <button class="key" id="enter">Enter</button>
            <button class="key" id="z">Z</button>
            <button class="key" id="x">X</button>
            <button class="key" id="c">C</button>
            <button class="key" id="v">V</button>
            <button class="key" id="b">B</button>
            <button class="key" id="n">N</button>
            <button class="key" id="m">M</button>
            <button class="key" id="backspace"><span class="material-symbols-outlined">backspace</span></button>
        </div>
    </section>
    


</body>
</html>
